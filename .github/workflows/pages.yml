# Mỗi lần push lên main: build các thiệp trong couples/ và đăng lên GitHub Pages
name: Đăng thiệp lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build thiệp
        run: node build.js
      - name: Trang chủ chuyển tới thiệp mẫu
        run: |
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=mau/">
          <title>Thiệp cưới</title>
          <a href="mau/">Xem thiệp mẫu</a>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
